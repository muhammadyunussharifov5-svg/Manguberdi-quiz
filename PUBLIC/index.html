<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manguberdi Quiz Tizimi</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background: #f0f2f5; color: #333; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; padding: 30px; margin-bottom: 20px; }
        h2, h3 { text-align: center; margin-bottom: 20px; color: #4a154b; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        button { background: #4a154b; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #611f69; }
        .danger-btn { background: #e01e5a; }
        .danger-btn:hover { background: #b81446; }
        .success-btn { background: #2bac76; }
        .success-btn:hover { background: #20875b; }
        .secondary-btn { background: #6c757d; }
        .option-btn { background: #f8f9fa; color: #333; border: 2px solid #dee2e6; text-align: left; }
        .option-btn:hover { background: #e9ecef; }
        .correct { background: #2bac76 !important; color: white !important; border-color: #2bac76 !important; }
        .wrong { background: #e01e5a !important; color: white !important; border-color: #e01e5a !important; }
        .hidden { display: none !important; }
        .flex-row { display: flex; gap: 10px; }
        .subject-card { border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; margin: 15px 0; background: #fafafa; }
        .monitor-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; font-size: 16px; }
    </style>
</head>
<body>

    <div id="view-main" class="container">
        <h2>Manguberdi Quiz Platformasi</h2>
        <button onclick="switchView('view-student-login')">Talaba Bo'limi</button>
        <button onclick="switchView('view-teacher-login')" class="secondary-btn">O'qituvchi Kabineti</button>
    </div>

    <div id="view-student-login" class="container hidden">
        <h3>Testga Kirish</h3>
        <input type="text" id="quiz-code" placeholder="Solo yoki Guruh kodini kiriting">
        <input type="text" id="student-name" placeholder="Ismingizni kiriting">
        <button onclick="checkQuizCode()">Testni Boshlash</button>
        <button onclick="switchView('view-main')" class="secondary-btn">Orqaga</button>
    </div>

    <div id="view-teacher-login" class="container hidden">
        <h3 id="auth-title">O'qituvchi Kirishi</h3>
        <input type="text" id="teacher-user" placeholder="Login">
        <input type="password" id="teacher-pass" placeholder="Parol">
        <input type="password" id="teacher-secret" class="hidden" placeholder="Maxfiy Kod (Faqat ro'yxatdan o'tishda)">
        
        <button id="btn-auth-primary" onclick="handleTeacherAuth()">Kirish</button>
        <p style="text-align:center; cursor:pointer; color:#4a154b;" id="auth-toggle" onclick="toggleAuthMode()">Yangi profil ochish (Ro'yxatdan o'tish)</p>
        <button onclick="switchView('view-main')" class="secondary-btn">Orqaga</button>
    </div>

    <div id="view-teacher-dashboard" class="container hidden">
        <h3>O'qituvchi Kabineti</h3>
        <div style="margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px;">
            <h4>Yangi test (Excel) yuklash</h4>
            <input type="file" id="excel-file" accept=".xlsx, .xls">
            <button onclick="uploadExcel()" class="success-btn">Excel faylni yuklash</button>
        </div>

        <h4>Mening Testlarim (Fanlar)</h4>
        <div id="subjects-list"></div>
        <button onclick="logoutTeacher()" class="secondary-btn">Chiqish</button>
    </div>

    <div id="view-subject-detail" class="container hidden">
        <h3 id="detail-subject-name">Fan bo'limlari</h3>
        <div id="sections-list"></div>
        <button onclick="switchView('view-teacher-dashboard')" class="secondary-btn">Orqaga (Kabinetga)</button>
    </div>

    <div id="view-quiz-play" class="container hidden">
        <h3 id="quiz-question-title">Savol yuklanmoqda...</h3>
        <div id="quiz-options-box"></div>
        <div id="quiz-status" style="margin-top:15px; font-weight:bold; text-align:center;"></div>
    </div>

    <div id="view-teacher-monitor" class="container hidden">
        <h3>Guruh Test Kuzatuv Paneli</h3>
        <h4 style="text-align: center; color: #2bac76;" id="monitor-code-display">KOD: </h4>
        <div id="monitor-students-box" style="margin: 20px 0;"></div>
        <button id="btn-next-question" onclick="triggerNextQuestion()" class="success-btn">Keyingi Savol</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentRole = ""; 
        let currentTeacher = "";
        let currentQuizCode = "";
        let currentStudentName = "";
        let isAuthModeLogin = true;
        let activeQuizQuestions = [];
        let currentSoloIndex = 0;
        let currentCorrectAnswer = "";
        let selectedSubjectId = "";

        function switchView(viewId) {
            document.querySelectorAll('.container').forEach(v => v.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }

        // --- INTERFEYS AVTOMATIK KO'RINISHI ---
        function toggleAuthMode() {
            isAuthModeLogin = !isAuthModeLogin;
            document.getElementById('auth-title').innerText = isAuthModeLogin ? "O'qituvchi Kirishi" : "O'qituvchi Ro'yxatdan O'tishi";
            document.getElementById('btn-auth-primary').innerText = isAuthModeLogin ? "Kirish" : "Ro'yxatdan o'tish";
            document.getElementById('auth-toggle').innerText = isAuthModeLogin ? "Yangi profil ochish (Ro'yxatdan o'tish)" : "Profilim bor (Kirish)";
            if(isAuthModeLogin) document.getElementById('teacher-secret').classList.add('hidden');
            else document.getElementById('teacher-secret').classList.remove('hidden');
        }

        // --- O'QITUVCHI AMALLARI ---
        async function handleTeacherAuth() {
            const user = document.getElementById('teacher-user').value;
            const pass = document.getElementById('teacher-pass').value;
            const secret = document.getElementById('teacher-secret').value;

            const endpoint = isAuthModeLogin ? '/api/teacher/login' : '/api/teacher/register';
            const bodyData = isAuthModeLogin ? { username: user, password: pass } : { username: user, password: pass, secretCode: secret };

            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bodyData)
            });
            const data = await res.json();
            if(data.error) return alert(data.error);

            if(isAuthModeLogin) {
                currentTeacher = data.username;
                loadSubjects();
                switchView('view-teacher-dashboard');
            } else {
                alert("Muvaffaqiyatli ro'yxatdan o'tdingiz! Endi kirishingiz mumkin.");
                toggleAuthMode();
            }
        }

        async function loadSubjects() {
            const res = await fetch('/api/subjects');
            const subjects = await res.json();
            const box = document.getElementById('subjects-list');
            box.innerHTML = "";

            subjects.forEach(sub => {
                const card = document.createElement('div');
                card.className = "subject-card";
                card.innerHTML = `
                    <strong style="font-size:18px; cursor:pointer; color:#4a154b;" onclick="openSubjectDetail('${sub.id}', '${sub.name}')">${sub.name}</strong>
                    <div class="flex-row" style="margin-top:10px;">
                        <button onclick="renameSubject('${sub.id}')" class="secondary-btn" style="padding:5px;">Nomni o'zgartirish</button>
                        <button onclick="startGroupMode('${sub.id}', null, 'random20')" class="success-btn" style="padding:5px;">Random 20 talik Guruh</button>
                        <button onclick="deleteSubject('${sub.id}')" class="danger-btn" style="padding:5px;">O'chirish</button>
                    </div>
                `;
                box.appendChild(card);
            });
        }

        async function uploadExcel() {
            const fileInput = document.getElementById('excel-file');
            if(!fileInput.files[0]) return alert("Fayl tanlang!");
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const res = await fetch('/api/quiz/upload', { method: 'POST', body: formData });
            const data = await res.json();
            if(data.error) alert(data.error);
            else { alert("Muvaffaqiyatli yuklandi!"); loadSubjects(); }
        }

        async function renameSubject(id) {
            const newName = prompt("Fan uchun yangi nom kiriting:");
            if(!newName) return;
            await fetch('/api/subject/rename', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id, newName })
            });
            loadSubjects();
        }

        async function deleteSubject(id) {
            if(!confirm("Haqiqatdan ham bu fanni butunlay o'chirmoqchimisiz?")) return;
            await fetch('/api/subject/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id })
            });
            loadSubjects();
        }

        async function openSubjectDetail(id, name) {
            selectedSubjectId = id;
            document.getElementById('detail-subject-name').innerText = name;
            const res = await fetch('/api/subjects');
            const subjects = await res.json();
            const sub = subjects.find(s => s.id === id);
            
            const box = document.getElementById('sections-list');
            box.innerHTML = "";
            sub.sections.forEach(sec => {
                const item = document.createElement('div');
                item.style = "border-bottom:1px solid #ccc; padding:10px 0;";
                item.innerHTML = `
                    <p><strong>${sec.name}</strong> (Solo Kod: <span style="color:#2bac76; font-weight:bold;">${sec.soloCode}</span>)</p>
                    <button onclick="startGroupMode('${sub.id}', '${sec.id}', 'normal')" class="success-btn" style="margin-top:5px; padding:6px;">Ushbu bo'lim bilan Guruhda o'ynash</button>
                `;
                box.appendChild(item);
            });
            switchView('view-subject-detail');
        }

        function startGroupMode(subjectId, sectionId, mode) {
            socket.emit('startGroupQuiz', { subjectId, sectionId, mode });
        }

        socket.on('sessionCreated', ({ code }) => {
            currentQuizCode = code;
            document.getElementById('monitor-code-display').innerText = "KOD: " + code;
            switchView('view-teacher-monitor');
            document.getElementById('monitor-students-box').innerHTML = "<p style='color:grey;text-align:center;'>Talabalar ulanishi kutilmoqda...</p>";
        });

        function triggerNextQuestion() {
            socket.emit('nextQuestion', { code: currentQuizCode });
        }

        socket.on('updateMonitor', (students) => {
            const box = document.getElementById('monitor-students-box');
            box.innerHTML = "";
            students.forEach(s => {
                const div = document.createElement('div');
                div.className = "monitor-item";
                div.innerHTML = `<span><strong>${s.name}</strong> (${s.score} ball)</span> <span>${s.status}</span>`;
                box.appendChild(div);
            });
        });

        function logoutTeacher() { currentTeacher = ""; switchView('view-main'); }

        // --- TALABA AMALLARI ---
        async function checkQuizCode() {
            const code = document.getElementById('quiz-code').value.trim();
            const name = document.getElementById('student-name').value.trim();
            if(!code || !name) return alert("Kod va ismingizni to'liq kiriting!");

            currentStudentName = name;
            currentQuizCode = code;

            const res = await fetch('/api/quiz/check-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            const data = await res.json();

            if(!data.valid) return alert("Bunday test kodi topilmadi!");

            if(data.type === 'solo') {
                activeQuizQuestions = data.questions; 
                currentSoloIndex = 0;
                runSoloQuiz();
            } else {
                socket.emit('joinGroup', { code, name });
            }
        }

        socket.on('studentJoinedSuccess', ({ code }) => {
            document.getElementById('quiz-question-title').innerText = "Guruh testi! O'qituvchi savol boshlashini kuting...";
            document.getElementById('quiz-options-box').innerHTML = "";
            switchView('view-quiz-play');
        });

        // --- TEST JARYONI (SOLO / GURUH) ---
        function runSoloQuiz() {
            switchView('view-quiz-play');
            if(currentSoloIndex >= activeQuizQuestions.length) {
                document.getElementById('quiz-question-title').innerText = "Tabriklaymiz! Solo test yakunlandi.";
                document.getElementById('quiz-options-box').innerHTML = `<button onclick="switchView('view-main')" class='success-btn'>Bosh sahifaga qaytish</button>`;
                return;
            }
            const q = activeQuizQuestions[currentSoloIndex];
            renderQuestion(q, currentSoloIndex + 1, activeQuizQuestions.length, true);
        }

        socket.on('newQuestion', ({ question, options, answer, index, total }) => {
            switchView('view-quiz-play');
            // Variantlarni har bir talaba uchun random aralashtirib berish
            const mixedOptions = shuffleArray(options.filter(o => o));
            renderQuestion({ question, options: mixedOptions, answer }, index, total, false);
        });

        function renderQuestion(q, current, total, isSolo) {
            document.getElementById('quiz-status').innerText = "";
            document.getElementById('quiz-question-title').innerText = `Savol ${current}/${total}: ${q.question}`;
            currentCorrectAnswer = q.answer;
            const box = document.getElementById('quiz-options-box');
            box.innerHTML = "";

            q.options.forEach(opt => {
                if(!opt) return;
                const btn = document.createElement('button');
                btn.className = "option-btn";
                btn.innerText = opt;
                btn.onclick = () => selectAnswer(btn, opt, isSolo);
                box.appendChild(btn);
            });
        }

        function selectAnswer(selectedBtn, val, isSolo) {
            // Hamma variant tugmalarini bloklash
            document.querySelectorAll('.option-btn').forEach(b => {
                b.disabled = true;
                if(b.innerText === currentCorrectAnswer) {
                    b.classList.add('correct'); // To'g'ri javobni har doim yashil qilish
                }
            });

            const isCorrect = (val === currentCorrectAnswer);

            if(!isCorrect) {
                selectedBtn.classList.add('wrong'); // Noto'g'ri tanlansa qizil bo'ladi
            }

            if(isSolo) {
                setTimeout(() => {
                    currentSoloIndex++;
                    runSoloQuiz();
                }, 2000);
            } else {
                socket.emit('submitAnswer', { code: currentQuizCode, name: currentStudentName, isCorrect });
                document.getElementById('quiz-status').innerText = isCorrect ? "To'g'ri! Keyingi savolni kuting..." : "Noto'g'ri! Keyingi savolni kuting...";
            }
        }

        socket.on('quizFinished', (results) => {
            document.getElementById('quiz-question-title').innerText = "Guruh testi yakunlandi! Natijalar:";
            const box = document.getElementById('quiz-options-box');
            box.innerHTML = "";
            results.sort((a,b) => b.score - a.score).forEach(r => {
                const p = document.createElement('p');
                p.style = "padding:8px; border-bottom:1px solid #ccc;";
                p.innerHTML = `<strong>${r.name}</strong> - ${r.score} ball`;
                box.appendChild(p);
            });
            const backBtn = document.createElement('button');
            backBtn.innerText = "Asosiy menuga qaytish";
            backBtn.onclick = () => switchView('view-main');
            box.appendChild(backBtn);
        });

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
    </script>
</body>
</html>
